<!DOCTYPE html>
<html>

<head>
    <title>Crear Admin</title>
</head>

<body
    style="background:#0f0f1a;color:white;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh">
    <div id="status" style="text-align:center;font-size:1.5rem">Creando usuario admin...</div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({
            apiKey: "AIzaSyBBqUt8Aitn3Fvj_SCYSgk-3uHrJCnNhTU",
            authDomain: "chontal-racing.firebaseapp.com",
            databaseURL: "https://chontal-racing-default-rtdb.firebaseio.com",
            projectId: "chontal-racing",
            storageBucket: "chontal-racing.firebasestorage.app",
            messagingSenderId: "118155735263",
            appId: "1:118155735263:web:40828fce5f38274cefb96a"
        });

        const auth = getAuth(app);
        const db = getDatabase(app);
        const el = document.getElementById("status");

        try {
            const cred = await createUserWithEmailAndPassword(auth, "waskareliasrios11@gmail.com", "111987");
            await updateProfile(cred.user, { displayName: "Waskar" });
            await set(ref(db, "users/" + cred.user.uid), {
                displayName: "Waskar",
                email: "waskareliasrios11@gmail.com",
                role: "admin",
                createdAt: Date.now()
            });
            el.innerHTML = "✅ ADMIN creado!<br>Email: waskareliasrios11@gmail.com<br>Password: 111987<br>UID: " + cred.user.uid + "<br><br><a href='/' style='color:#ff6b35'>Ir al Login →</a>";
        } catch (err) {
            el.innerHTML = "❌ Error: " + err.message + "<br><br><a href='/' style='color:#ff6b35'>Ir al Login →</a>";
        }
    </script>
</body>

</html>
